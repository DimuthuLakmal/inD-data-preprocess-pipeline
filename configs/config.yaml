# Model Configs
model:
  train_batch_size: 16
  test_batch_size: 16
  train_epochs: 100
  model_output_path: "output/model/pems08/epoch_{}_model.pt" # save trained model to this path
  load_saved_model: False # if you want pre-trained model weights to be loaded
  model_input_path: "output/model/pems08/epoch_58_model.pt" # pretrained model path
  device: cuda # decides GPU or CPU for training
  graph_weight_encoder:
    dim_model: 32 # dimension that embedding layer maps the input of the model to.
    seq_len: 20 # input sequence length
    input_dim: 7 # input dimension, inputs is traffic flow value, in some dataset it may be combined with time index
    num_layers: 4 # # of temporal encoder layers
    num_heads: 8 # # of temporal encoder layers
    dropout_e_normal: 0.0 # dropout applied to the final output of temporal encoder layer of the first encoder
    dropout_e_rep: 0.2 # dropout applied to the final output of temporal encoder layer of the second encoder (representative time sequence)

# Data Configs
data:
  dataset_dir: "../data/"
  dataset: "ind" # dataset name
  visualizer_params_dir: "../data/visualizer_params/"
  history_length: 20
  num_workers: 1 # number of workers for data loading