# Model Configs
model:
  lr: 0.001 # learning rate
  use_lr_scheduler: True # if you want to use learning rate scheduler
  save_checkpoints: True # HPO trials set this False to avoid writing a checkpoint every epoch
  save_best_checkpoint: True # independent of save_checkpoints - controls only the best-so-far save
  train_batch_size: 8
  test_batch_size: 8
  train_epochs: 150
  model_output_path: "../results/checkpoints/epoch_{}.pt"
  load_saved_model: False # if you want pre-trained model weights to be loaded
  model_input_path: "../results/checkpoints/best_vstsbgat_0-7-8-18-19-scenes.pt" # pretrained model path
  log_file: "../results/app_{}.log" # pretrained model path
  tb_log_dir: "../results/runs/" # tensorboard log dir
  device: cuda # decides GPU or CPU for training
  obs_temporal_encoder: # observation temporal encoder
    dim_model: 64 # dimension that embedding layer maps the input of the model to.
    seq_len: 21 # input sequence length
    input_dim: 10 # input dimension
    num_layers: 4 # # of temporal encoder layers
    num_heads: 8 # # of temporal encoder layers
    dropout: 0.2 # dropout applied to the final output of temporal encoder layer
  z_temporal_encoder: # masking input's temporal encoder. We could also use the same encoder for obs_temporal_encoder
    dim_model: 64 # dimension that embedding layer maps the input of the model to.
    seq_len: 21 # input sequence length
    input_dim: 10 # input dimension
    num_layers: 2 # # of temporal encoder layers
    num_heads: 2 # # of temporal encoder layers
    dropout: 0.2 # dropout applied to the final output of temporal encoder layer
  gat:
    ogm_input_dim: 2 # input dimension of the occupancy grid map cells
    dim_model: 64 # dimension that embedding layer maps the input of the model to.
    dim_cell_model: 16 # dimension that embedding layer maps each cell of the ogm
    dim_obs_model: 64 # dimension that embedding layer maps the latent observation output from temporal encoder
    dim_edge: 1 # edge feature dimension
    num_heads: 2
    dropout: 0.1
    head_diversity_weight: 1.0
    l0_loss_weights: [1.0, 0.75]

  map_encoder:
    architecture: convnext_tiny
    num_semantic_classes: 9
    pretrained: true
    # Recommended for categorical semantic channels.
    stem_init: random
    projection_dim: 16
    map_context_dim: 64
    cell_node_dim: 16
    dropout: 0.3
    freeze_backbone: false

# Data Configs
data:
  dataset_dir: "../data/"
  label_dir: "../data/annotations/"
  dataset: "ind" # dataset name
  visualizer_params_dir: "../data/visualizer_params/"
  history_length: 20
  num_features: 9 # number of features of the input data
  num_workers: 1 # number of workers for data loading
  start_scene: 0
  end_scene: 24
  observation_data_filename: "data.pkl"