# Model Configs
model:
  lr: 0.0005 # learning rate
  use_lr_scheduler: True # if you want to use learning rate scheduler
  train_batch_size: 4
  test_batch_size: 4
  train_epochs: 150
  model_output_path: "../results/checkpoints/epoch_{}.pt"
  load_saved_model: False # if you want pre-trained model weights to be loaded
  model_input_path: "output/model/pems08/epoch_58_model.pt" # pretrained model path
  log_file: "../results/app_{}.log" # pretrained model path
  tb_log_dir: "../results/runs/" # tensorboard log dir
  device: cuda # decides GPU or CPU for training
  obs_temporal_encoder: # observation temporal encoder
    dim_model: 32 # dimension that embedding layer maps the input of the model to.
    seq_len: 21 # input sequence length
    input_dim: 10 # input dimension
    num_layers: 4 # # of temporal encoder layers
    num_heads: 4 # # of temporal encoder layers
    dropout: 0.0 # dropout applied to the final output of temporal encoder layer
  z_temporal_encoder: # masking input's temporal encoder. We could also use the same encoder for obs_temporal_encoder
    dim_model: 32 # dimension that embedding layer maps the input of the model to.
    seq_len: 21 # input sequence length
    input_dim: 10 # input dimension
    num_layers: 4 # # of temporal encoder layers
    num_heads: 4 # # of temporal encoder layers
    dropout: 0.0 # dropout applied to the final output of temporal encoder layer
  gat:
    ogm_input_dim: 2 # input dimension of the occupancy grid map cells
    dim_model: 32 # dimension that embedding layer maps the input of the model to.
    dim_cell_model: 32 # dimension that embedding layer maps each cell of the ogm
    dim_obs_model: 32 # dimension that embedding layer maps the latent observation output from temporal encoder
    dim_edge: 1 # edge feature dimension
    num_heads: 4
    dropout: 0.2

  map_encoder:
    architecture: convnext_tiny
    num_semantic_classes: 9
    pretrained: true
    # Recommended for categorical semantic channels.
    stem_init: random
    projection_dim: 32
    map_context_dim: 32
    cell_node_dim: 32
    dropout: 0.1
    freeze_backbone: false

# Data Configs
data:
  dataset_dir: "../data/"
  label_dir: "../data/annotations/"
  dataset: "ind" # dataset name
  visualizer_params_dir: "../data/visualizer_params/"
  history_length: 20
  num_features: 9 # number of features of the input data
  num_workers: 1 # number of workers for data loading
  start_scene: 0
  end_scene: 24
  observation_data_filename: "data.pkl"