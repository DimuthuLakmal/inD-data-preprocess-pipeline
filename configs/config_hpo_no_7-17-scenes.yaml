data:
  dataset: ind
  dataset_dir: ../data/
  end_scene: 24
  history_length: 20
  label_dir: ../data/annotations/
  num_features: 9
  num_workers: 1
  observation_data_filename: data.pkl
  start_scene: 0
  visualizer_params_dir: ../data/visualizer_params/
model:
  device: cuda
  gat:
    dim_cell_model: 16
    dim_edge: 1
    dim_model: 16
    dim_obs_model: 32
    dropout: 0.0003174375015387171
    num_heads: 1
    ogm_input_dim: 2
  load_saved_model: false
  log_file: ../results/app_{}.log
  lr: 0.0009859477790516557
  map_encoder:
    architecture: convnext_tiny
    cell_node_dim: 16
    dropout: 0.1952519813572437
    freeze_backbone: false
    map_context_dim: 16
    num_semantic_classes: 9
    pretrained: true
    projection_dim: 64
    stem_init: random
  model_input_path: ../results/checkpoints/best_optuna_trial_vstsbgat_no_7-17-scenes.pt
  model_output_path: ../results/checkpoints/epoch_{}.pt
  obs_temporal_encoder:
    dim_model: 32
    dropout: 0.020404345440310983
    input_dim: 10
    num_heads: 1
    num_layers: 5
    seq_len: 21
  save_best_checkpoint: true
  save_checkpoints: true
  tb_log_dir: ../results/runs/
  test_batch_size: 16
  train_batch_size: 16
  train_epochs: 100
  use_lr_scheduler: true
  z_temporal_encoder:
    dim_model: 32
    dropout: 0.18415437756906952
    input_dim: 10
    num_heads: 2
    num_layers: 6
    seq_len: 21
